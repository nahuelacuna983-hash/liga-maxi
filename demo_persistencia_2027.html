<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Liga Maxi 2027 | PostgreSQL local</title><link rel="stylesheet" href="style.css"><style>body{background:#f4f6f8}.app{max-width:980px;margin:auto;padding:24px}.head{background:#16324f;color:#fff;padding:20px;border-radius:8px}.panel{background:#fff;border:1px solid #d8e0e7;border-radius:8px;padding:18px;margin-top:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input,button{padding:9px}button{cursor:pointer}.notice{background:#fff3d6;padding:10px;border-radius:6px}.row{padding:8px 0;border-bottom:1px solid #e5e9ed}</style></head><body><main class="app"><header class="head"><h1>LIGA MAXI 2027 — PERSISTENCIA LOCAL</h1><p>PostgreSQL aislado · el navegador no recibe credenciales</p></header><section class="panel"><label>Servidor <input id="base-url" value="http://127.0.0.1:8787"></label><button id="connect">Conectar</button><p id="status" role="status">Sin conexión.</p></section><section class="panel"><h2>Operación</h2><div class="actions"><input id="tournament-name" placeholder="Torneo"><button id="create-tournament">Crear torneo</button><input id="category-name" placeholder="Categoría"><button id="create-category">Crear categoría</button></div><div class="actions"><input id="team-name" placeholder="Equipo"><button id="add-team">Agregar equipo</button><button id="generate-fixture">Guardar fixture de prueba</button></div><div class="actions"><input id="match-id" placeholder="ID partido"><input id="schedule-date" type="datetime-local"><input id="court" placeholder="Cancha"><button id="schedule">Programar</button><input id="home-score" type="number" placeholder="Local"><input id="away-score" type="number" placeholder="Visitante"><button id="save-result">Guardar resultado</button></div></section><section class="panel"><h2>Estado recuperado</h2><pre id="state">Conectá el servidor para consultar.</pre></section></main><script src="demo_2027_http_client.js"></script><script>
(() => { let client; let tournament; let category; let teams = []; const $ = (id) => document.getElementById(id); const status = (message) => { $("status").textContent = message; }; const fail = (error) => status(`Error: ${error.message}`); async function refresh() { if (!category) return; $("state").textContent = JSON.stringify(await client.categoryState(category.id), null, 2); } $("connect").onclick = async () => { try { client = new PostgresHttpClient($("base-url").value); await client.health(); const tournaments = await client.tournaments(); tournament = tournaments[0] || null; if (tournament) { const categories = await client.categories(tournament.id); category = categories[0] || null; } status(tournament ? `Conectado. Torneo: ${tournament.name}` : "Conectado. Sin torneos."); await refresh(); } catch (error) { fail(error); } }; $("create-tournament").onclick = async () => { try { tournament = await client.tournament({ id: crypto.randomUUID(), organizationId: crypto.randomUUID(), name: $("tournament-name").value, season: 2027 }); status("Torneo confirmado por PostgreSQL."); } catch (error) { fail(error); } }; $("create-category").onclick = async () => { try { category = await client.category({ id: crypto.randomUUID(), tournamentId: tournament.id, name: $("category-name").value }); teams = []; status("Categoría confirmada por PostgreSQL."); await refresh(); } catch (error) { fail(error); } }; $("add-team").onclick = async () => { try { const team = await client.team({ id: crypto.randomUUID(), categoryId: category.id, name: $("team-name").value }); teams.push(team); status("Equipo confirmado por PostgreSQL."); } catch (error) { fail(error); } }; $("generate-fixture").onclick = async () => { try { const matches = []; for (let i = 0; i < teams.length; i++) for (let j = i + 1; j < teams.length; j++) matches.push({ id: crypto.randomUUID(), round: Math.floor(matches.length / 2), homeTeamId: teams[i].id, awayTeamId: teams[j].id }); await client.fixture({ categoryId: category.id, actorId: crypto.randomUUID(), matches }); status("Fixture confirmado por PostgreSQL."); await refresh(); } catch (error) { fail(error); } }; $("schedule").onclick = async () => { try { await client.schedule($("match-id").value, { actorId: crypto.randomUUID(), scheduledAt: new Date($("schedule-date").value).toISOString(), court: $("court").value }); status("Programación confirmada por PostgreSQL."); await refresh(); } catch (error) { fail(error); } }; $("save-result").onclick = async () => { try { await client.result($("match-id").value, { actorId: crypto.randomUUID(), homeScore: Number($("home-score").value), awayScore: Number($("away-score").value) }); status("Resultado confirmado por PostgreSQL."); await refresh(); } catch (error) { fail(error); } }; })();
</script></body></html>
