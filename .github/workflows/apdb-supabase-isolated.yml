name: APdB Supabase isolated integration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama autorizada de desarrollo"
        required: true
        default: codex/apdb-2027-operational-hardening
        type: string

jobs:
  isolated:
    if: ${{ github.event_name == 'push' || inputs.ref == 'codex/apdb-2027-operational-hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTHORIZED_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_REF }}
      - name: Verify branch and isolated project
        run: |
          test "$AUTHORIZED_REF" = "codex/apdb-2027-operational-hardening"
          grep -q 'project_id = "apdb-2027-isolated"' supabase/config.toml
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start disposable Supabase
        run: supabase start
      - name: Export isolated service endpoints
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Apply isolated migrations and seed
        run: |
          supabase db reset --local
      - name: Run local contracts
        run: |
          node tests/apdb-supabase-isolated-contract.cjs
          node tests/apdb-isolated-migration-contract.cjs
          node tests/apdb-2027-authorization-contract.cjs
          node tests/apdb-supabase-isolated-integration.cjs
          node tests/apdb-storage-backup-integration.cjs
          node tests/apdb-championship-isolated-integration.cjs
      - name: Install Chromium for isolated browser validation
        run: npx playwright install chromium
      - name: Prepare isolated browser identity
        run: node tests/apdb-isolated-browser-setup.cjs
      - name: Run isolated Chromium validation
        env:
          APDB_ISOLATED_BROWSER_URL: ${{ env.SUPABASE_URL }}
        run: npx playwright test tests/apdb-isolated-browser.spec.cjs tests/apdb-isolated-session-switch-browser.spec.cjs
      - name: Upload isolated Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apdb-isolated-chromium-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
