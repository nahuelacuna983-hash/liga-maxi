name: RLS local integration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o SHA del PR que contiene tools/rls-local-test.sql"
        required: true
        default: codex/issue-1-bloque-1
        type: string

jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: liga_maxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liga_maxi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Run isolated RLS/RPC matrix
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: liga_maxi_test
        run: psql -v ON_ERROR_STOP=1 -f tools/rls-local-test.sql
