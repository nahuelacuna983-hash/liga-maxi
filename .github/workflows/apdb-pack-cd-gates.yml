name: APdB 2027 packs C-D release gates
on:
  push:
    branches:
      - codex/apdb-2027-pack-cd-release-gates
      - codex/apdb-2027-final-integrated-candidate
      - codex/apdb-2027-hosting-release-finalization
  pull_request:
    paths:
      - 'tools/build-apdb-staging.cjs'
      - 'tools/verify-apdb-release.cjs'
      - 'tests/apdb-staging-build.cjs'
      - 'tests/apdb-package-http-smoke.cjs'
      - 'tests/apdb-package-rollback-rehearsal.cjs'
      - 'tools/check-apdb-hosted-pilot.cjs'
      - 'tools/check-apdb-hosted-release.cjs'
      - 'tests/apdb-cpanel-auth-http-contract.cjs'
      - 'tests/apdb-hosted-pilot-gate.cjs'
      - 'tests/apdb-institutional-package-browser.spec.cjs'
      - 'tests/demo-circuit-browser.spec.cjs'
      - 'tools/demo-server.cjs'
      - 'index_online.html'
      - 'app_online.js'
      - 'docs/apdb-2027/PACK_C_D_ACEPTACION.md'
      - '.github/workflows/apdb-pack-cd-gates.yml'
permissions:
  contents: read
jobs:
  isolated-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check tools/build-apdb-staging.cjs
          node --check tools/verify-apdb-release.cjs
          node --check tests/apdb-staging-build.cjs
          node --check tests/apdb-package-http-smoke.cjs
          node --check tests/apdb-package-rollback-rehearsal.cjs
          node --check tools/check-apdb-hosted-pilot.cjs
          node --check tools/check-apdb-hosted-release.cjs
          node --check tests/apdb-cpanel-auth-http-contract.cjs
          node --check tests/apdb-hosted-pilot-gate.cjs
          node --check tests/apdb-institutional-package-browser.spec.cjs
          node --check app_online.js
      - name: Build, tamper test, and validate source separation
        run: |
          node tests/apdb-staging-build.cjs
          node tests/apdb-online-config-contract.cjs
          node tests/institutional-package-contract.cjs
      - name: Local HTTP smoke test of packaged institutional site
        run: node tests/apdb-package-http-smoke.cjs
      - name: Verify authenticated cPanel HTTP byte integrity locally
        run: node tests/apdb-cpanel-auth-http-contract.cjs
      - name: Offline release and rollback rehearsal
        run: node tests/apdb-package-rollback-rehearsal.cjs
      - name: Protected hosted pilot preflight (localhost synthetic scenarios only)
        run: node tests/apdb-hosted-pilot-gate.cjs
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for institutional browser checks
        run: npx playwright install --with-deps chromium
      - name: Institutional package browser shell (desktop and mobile)
        run: |
          npx playwright test tests/apdb-institutional-package-browser.spec.cjs --workers=1
          # playwright.config.cjs starts and stops the demo server itself.
          npx playwright test tests/demo-circuit-browser.spec.cjs --workers=1
