name: PostgreSQL adapter integration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to test
        required: true
        default: codex/demo-2027-visual

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/postgres-adapter-integration.cjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
