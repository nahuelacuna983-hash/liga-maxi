name: PostgreSQL adapter integration

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA from codex/demo-2027-visual
        required: true
        default: 6c33edbbdf4a5264a1600e50d5bdfe0d82fcd579
        type: string

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      AUTHORIZED_BRANCH: codex/demo-2027-visual
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/demo-2027-visual
          fetch-depth: 0
      - name: Validate and checkout requested commit
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          printf '%s\n' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "$REQUESTED_SHA^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SHA" "origin/$AUTHORIZED_BRANCH"
          git checkout --detach "$REQUESTED_SHA"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/postgres-adapter-integration.cjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: node tests/postgres-http-integration.cjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: npx playwright install --with-deps chromium
      - name: Create isolated browser database
        run: |
          createdb -h 127.0.0.1 -U postgres liga_maxi_browser
          psql -h 127.0.0.1 -U postgres -d liga_maxi_browser -v ON_ERROR_STOP=1 -f docs/demo-2027-postgres-schema.sql
        env:
          PGPASSWORD: postgres
      - name: Start backend on isolated browser database
        run: |
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/liga_maxi_browser node demo_2027_postgres_server.js > postgres-browser-server.log 2>&1 &
      - run: npx playwright test tests/postgres-circuit-browser.spec.cjs
        env:
          POSTGRES_UI_BASE_URL: http://127.0.0.1:8787/demo_circuito_2027.html?mode=postgres
      - run: npx playwright test tests/postgres-championship-browser.spec.cjs
        env:
          POSTGRES_UI_BASE_URL: http://127.0.0.1:8787/demo_circuito_2027.html?mode=postgres
