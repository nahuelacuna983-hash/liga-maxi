name: APdB 2027 document RPC contract (isolated)
on:
  push:
    branches:
      - codex/apdb-2027-document-view-security-preflight
      - codex/apdb-2027-institutional-security-candidate
      - codex/apdb-2027-full-release-verification
  pull_request:
    paths:
      - app_online.js
      - tests/apdb-document-rpc-contract.cjs
      - supabase/patches/apdb_2027_team_documents_secure_rpc_draft.sql
      - .github/workflows/apdb-document-rpc-static.yml

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app_online.js
      - name: Verify scoped RPC contract
        run: node tests/apdb-document-rpc-contract.cjs

  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: apdb_synthetic_only
          POSTGRES_DB: apdb_synthetic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: apdb_synthetic_only
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: apdb_synthetic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backup verifier dependency
        run: npm ci --ignore-scripts --omit=optional
      - name: Install PostgreSQL client if unavailable
        run: |
          if ! command -v pg_dump >/dev/null || ! pg_dump --version | grep -q '16\.'; then
            sudo install -d /usr/share/postgresql-common/pgdg
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client-16
          fi
      - name: Compile patch and exercise role isolation on synthetic schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/security/apdb_document_rpc_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/patches/apdb_2027_team_documents_secure_rpc_draft.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/security/apdb_document_rpc_isolation.sql

      - name: Prove synthetic PostgreSQL backup and restore
        run: |
          createdb -h localhost -U postgres apdb_2027_restored
          mkdir -p /tmp/apdb-backup
          APDB_BACKUP_SOURCE_URL='postgresql://postgres:apdb_synthetic_only@127.0.0.1:5432/apdb_synthetic_test' \
          APDB_BACKUP_TARGET_URL='postgresql://postgres:apdb_synthetic_only@127.0.0.1:5432/apdb_2027_restored' \
          APDB_BACKUP_DIR=/tmp/apdb-backup \
          PG_BIN=/usr/lib/postgresql/16/bin \
          node tools/postgres-backup-restore.cjs
          PGDATABASE=apdb_2027_restored psql -X -v ON_ERROR_STOP=1 -f tests/security/apdb_document_rpc_isolation.sql

  institutional-package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Official staging package contract
        run: |
          node tests/apdb-staging-build.cjs
          node tests/apdb-online-config-contract.cjs
          node tests/institutional-package-contract.cjs
